<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Voxel Pagoda Garden</title>
<style>*{margin:0;padding:0;overflow:hidden}</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){

// ─── Palette (quantized to ~20 colors for instanced mesh batching) ──
var C = {
  roofDark:    0x1a1a2e,
  roofMid:     0x2d2d4a,
  wall:        0xf5f0e8,
  wallShade:   0xe0d8c8,
  wood:        0x6b3a2a,
  woodDark:    0x4a2518,
  gold:        0xd4a017,
  goldBright:  0xf0c840,
  grassA:      0x3a7d32,
  grassB:      0x4e9a3e,
  grassC:      0x2d6b28,
  path:        0xc8b89a,
  stone:       0x888888,
  stoneDark:   0x666666,
  waterA:      0x3388aa,
  waterB:      0x226688,
  bark:        0x5c3a1e,
  leaves:      0x2d8a4e,
  leavesDark:  0x1e6b35,
  leavesLight: 0x4aad6a,
  cherry:      0xff9eb5,
  cherryLt:    0xffc0d0,
  cherryWhite: 0xffe8f0,
  lantern:     0xccaa66,
  glow:        0xffdd88,
  flower:      0xff6b9d,
  flowerYell:  0xffdd44,
  fence:       0x8b5e3c,
  foundation:  0x777777,
  white:       0xffffff,
};

// ─── Globals ───────────────────────────────────────────────────────
var scene, camera, renderer, clock;
var VOXEL = 0.5;
var voxelMeshes = {};   // colorKey → { geo, mat, mesh, count }

// ─── Voxel batch placement ─────────────────────────────────────────
function getBatch(color) {
  if (voxelMeshes[color]) return voxelMeshes[color];
  var geo = new THREE.BoxGeometry(VOXEL*0.97, VOXEL*0.97, VOXEL*0.97);
  var mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.85, metalness: 0.05 });
  var mesh = new THREE.InstancedMesh(geo, mat, 4000);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  voxelMeshes[color] = { geo: geo, mat: mat, mesh: mesh, count: 0 };
  return voxelMeshes[color];
}

var _mtx = new THREE.Matrix4();
function place(pos, color) {
  var b = getBatch(color);
  _mtx.setPosition(pos.x * VOXEL, pos.y * VOXEL, pos.z * VOXEL);
  b.mesh.setMatrixAt(b.count++, _mtx);
}

function commit() {
  for (var k in voxelMeshes) {
    var b = voxelMeshes[k];
    b.mesh.instanceMatrix.needsUpdate = true;
    b.mesh.count = b.count;
  }
}

// ─── Build functions ────────────────────────────────────────────────
function buildGround() {
  var R = 45;
  for (var x = -R; x <= R; x++) {
    for (var z = -R; z <= R; z++) {
      var dist = Math.sqrt(x*x + z*z);
      if (dist > R) continue;
      // Pond hole
      var pdist = Math.sqrt((x-18)*(x-18)+(z+12)*(z+12));
      if (pdist < 8) continue;
      // Paths
      var p1 = Math.abs(z - x*0.3) * Math.exp(-(x+5)*(x+5)/200);
      var p2 = Math.abs(x) * Math.exp(-(z-8)*(z-8)/400);
      if (p1 < 1.6 || p2 < 1.6) {
        place({x:x, y:0, z:z}, p1<1.6 ? C.path : C.pathLight||C.path);
      } else {
        var noise = ((x*7+z*13)%5)/5;
        var col = C.grassA;
        if (noise > 0.65) col = C.grassB;
        else if (noise < 0.35) col = C.grassC;
        place({x:x, y:0, z:z}, col);
      }
    }
  }
}

function buildPagoda() {
  var floors = 5;
  var baseSize = 10;
  var yOff = 0;
  var cx = -5, cz = -5;

  // Foundation steps
  for (var step = 0; step < 3; step++) {
    var s = baseSize + 2 + step*2;
    var hy = step;
    for (var x = -s; x <= s; x++) {
      for (var z = -s; z <= s; z++) {
        if (Math.abs(x)===s && Math.abs(z)===s && step < 2) continue;
        place({x:cx+x, y:hy, z:cz+z}, C.foundation);
      }
    }
  }
  yOff = 3;

  for (var f = 0; f < floors; f++) {
    var w = Math.floor(baseSize - f*1.5);
    var h = 4;

    // Walls - hollow box
    for (var y = 0; y < h; y++) {
      for (var x = -w; x <= w; x++) {
        for (var z = -w; z <= w; z++) {
          var isEdge = Math.abs(x)===w || Math.abs(z)===w;
          if (!isEdge) {
            // Interior darkness – skip most, keep floor
            if (y === 0) place({x:cx+x, y:yOff+y, z:cz+z}, C.wallShade);
            continue;
          }
          var col = C.wall;
          if (y === 0) col = C.woodDark;
          else if ((Math.abs(x)+Math.abs(z)) % 3 === 0) col = C.wallShade;
          // Door on ground floor
          if (f===0 && y<2 && Math.abs(x)<1 && z===w) col = C.wood;
          // Windows
          if (f>0 && y>=1 && y<=2 && ((Math.abs(x)===w&&Math.abs(z)<2)||(Math.abs(z)===w&&Math.abs(x)<2))) {
            col = C.wood;
          }
          place({x:cx+x, y:yOff+y, z:cz+z}, col);
        }
      }
    }

    // Roof – flared corners
    var roofH = 2, overhang = 2;
    for (var ry = 0; ry < roofH; ry++) {
      var inset = ry;
      var rW = w + overhang - inset;
      for (var rx = -rW; rx <= rW; rx++) {
        for (var rz = -rW; rz <= rW; rz++) {
          var isRoofEdge = Math.abs(rx)===rW || Math.abs(rz)===rW;
          var isCorner = Math.abs(rx)>rW-2 && Math.abs(rz)>rW-2;
          if (isRoofEdge || (ry===0 && Math.abs(rx)===w+1 && Math.abs(rz)===w+1)) {
            var rcol = ry===0 ? C.roofMid : C.roofLight;
            if (isRoofEdge && !isCorner) { /* plain roof */ }
            else if (isCorner) {
              // flared corner voxels
              place({x:cx+rx, y:yOff+h+ry, z:cz+rz}, rcol);
              place({x:cx+rx+(rx>0?-1:1), y:yOff+h+ry, z:cz+rz}, rcol);
              place({x:cx+rx, y:yOff+h+ry, z:cz+rz+(rz>0?-1:1)}, rcol);
              continue;
            } else {
              place({x:cx+rx, y:yOff+h+ry, z:cz+rz}, rcol);
              continue;
            }
          }
        }
      }
    }

    // Gold ridge ornament
    var ridgeY = yOff + h + roofH;
    place({x:cx, y:ridgeY, z:cz}, C.gold);
    if (f < floors-1) place({x:cx, y:ridgeY+1, z:cz}, C.goldBright);

    // Corner roof tips
    for (var ddx = -1; ddx <= 1; ddx += 2) {
      for (var ddz = -1; ddz <= 1; ddz += 2) {
        place({x:cx+(w+overhang)*ddx, y:yOff+h+0.5, z:cz+(w+overhang)*ddz}, C.roofDark);
      }
    }

    yOff += h + roofH - 1;
  }

  // Spire
  var spireBase = yOff;
  for (var sy = 0; sy < 6; sy++) {
    place({x:cx, y:spireBase+sy, z:cz}, C.gold);
    if (sy > 0) {
      for (var sdx = -1; sdx <= 1; sdx++) {
        for (var sdz = -1; sdz <= 1; sdz++) {
          if (sdx===0 && sdz===0) continue;
          place({x:cx+sdx, y:spireBase+sy, z:cz+sdz}, C.goldBright);
        }
      }
    }
  }
  place({x:cx, y:spireBase+6, z:cz}, C.goldBright);

  // Steps
  for (var st = 0; st < 3; st++) {
    for (var sx = -3; sx <= 3; sx++) {
      place({x:cx+sx, y:-1-st, z:cz+baseSize+2+st}, C.stone);
    }
  }
}

function buildPond() {
  var cx=18, cz=-12;
  for (var x = -9; x <= 9; x++) {
    for (var z = -7; z <= 7; z++) {
      var d = Math.sqrt(x*x/1.44 + z*z);
      if (d < 7) {
        var col = C.waterA;
        if (d < 3 || d > 5.5) col = C.waterB;
        place({x:cx+x, y:-0.3, z:cz+z}, col);
        if ((x*3+z*7)%11===0 && d>2 && d<5) place({x:cx+x, y:0.05, z:cz+z}, C.leaves);
      } else if (d < 8) {
        place({x:cx+x, y:-0.1, z:cz+z}, (x+z)%3===0 ? C.stone : C.stoneDark);
      }
    }
  }
}

function buildCherryTree(tx, ty, tz, scale) {
  var s = scale || 1;
  var th = Math.floor(5*s);
  // Trunk
  for (var y = 0; y < th; y++) {
    place({x:tx, y:ty+y, z:tz}, C.bark);
    if (y < 2) { place({x:tx+1, y:ty+y, z:tz}, C.bark); place({x:tx-1, y:ty+y, z:tz}, C.bark); }
  }
  // Branches
  var brs = [[2,3,0],[-2,4,1],[0,3,2],[0,2,-2],[3,5,0],[-1,3,1]];
  for (var bi = 0; bi < brs.length; bi++) {
    var b = brs[bi];
    for (var t = 0; t < 3; t++) {
      place({x:tx+b[0]*t, y:ty+th-b[1]+t*0.5|0, z:tz+b[2]*t}, C.bark);
    }
  }
  // Canopy – pink cloud of voxels
  var centers = [
    [0,th+2,0],[1,th+1,0],[-1,th+3,0],[0,th+1,1],[0,th+1,-1],
    [2,th+2,1],[-2,th+2,-1],[1,th+3,-1],[-1,th+2,1]
  ];
  for (var ci = 0; ci < centers.length; ci++) {
    var cc = centers[ci];
    for (var ex = -3; ex <= 3; ex++) {
      for (var ey = -2; ey <= 2; ey++) {
        for (var ez = -3; ez <= 3; ez++) {
          var dd = Math.sqrt(ex*ex+ey*ey*1.5+ez*ez);
          if (dd < 2.6 + Math.random()*0.9) {
            var rr = Math.random();
            var col = C.cherry;
            if (rr > 0.6) col = C.cherryLt;
            else if (rr > 0.85) col = C.cherryWhite;
            else if (rr < 0.12) col = C.leavesLight;
            place({x:tx+cc[0]+ex*0.5, y:ty+cc[1]+ey*0.5, z:tz+cc[2]+ez*0.5}, col);
          }
        }
      }
    }
  }
  // Falling petals
  for (var pi = 0; pi < 18; pi++) {
    place({
      x: tx + (Math.random()-0.5)*9,
      y: ty + Math.random()*th*0.8,
      z: tz + (Math.random()-0.5)*9
    }, C.cherryLt);
  }
}

function buildPineTree(tx, ty, tz, scale) {
  var s = scale || 1;
  var th = Math.floor(4*s);
  for (var y = 0; y < th; y++) place({x:tx, y:ty+y, z:tz}, C.bark);
  for (var layer = 0; layer < 4; layer++) {
    var ly = ty + th - 1 + layer*1.5|0;
    var r = 3 - layer*0.5;
    for (var x = -r|0; x <= r|0; x++) {
      for (var z = -r|0; z <= r|0; z++) {
        if (Math.sqrt(x*x+z*z) < r) {
          var col = C.leaves;
          if (Math.abs(x)+Math.abs(z*3)%4===0) col = C.leavesLight;
          place({x:tx+x, y:ly, z:tz+z}, col);
        }
      }
    }
  }
}

function buildTrees() {
  var positions = [
    // Cherry trees
    {x:-20,z:5,s:1.2,ch:true},{x:-15,z:-15,s:1.0,ch:true},
    {x:10, z:-20,s:1.3,ch:true},{x:-25,z:-5, s:0.9,ch:true},
    {x:5,  z:18, s:1.1,ch:true},{x:-10,z:20, s:1.0,ch:true},
    // Pine trees
    {x:-30,z:10, s:1.4,ch:false},{x:25, z:-5,  s:1.2,ch:false},
    {x:-8, z:-25,s:1.3,ch:false},{x:30, z:15,  s:1.1,ch:false},
    {x:-28,z:-18,s:1.5,ch:false},{x:15, z:25,  s:1.0,ch:false},
  ];
  for (var i = 0; i < positions.length; i++) {
    var t = positions[i];
    if (t.ch) buildCherryTree(t.x, 1, t.z, t.s);
    else buildPineTree(t.x, 1, t.z, t.s);
  }
}

function buildLanterns() {
  var pos = [{x:-2,z:8},{x:-8,z:8},{x:12,z:-3}];
  for (var i = 0; i < pos.length; i++) {
    var p = pos[i], lx=p.x, lz=p.z;
    // Base
    for (var bx=-1;bx<=1;bx++) for(var bz=-1;bz<=1;bz++) place({x:lx+bx,y:0,z:lz+bz},C.stone);
    // Pillar
    for(var y=1;y<4;y++) place({x:lx,y:y,z:lz},C.stone);
    // Light chamber
    for(var bx=-1;bx<=1;bx++) for(var bz=-1;bz<=1;bz++) place({x:lx+bx,y:4,z:lz+bz},C.lantern);
    // Roof
    place({x:lx,y:5,z:lz},C.stoneDark);
    place({x:lx,y:6,z:lz},C.stoneDark);
    // Glow core
    place({x:lx,y:4,z:lz},C.glow);
  }
}

function buildBridge() {
  var cx=18, cz=-6;
  for (var i = 0; i < 8; i++) {
    var arc = Math.sin(i/7*Math.PI)*1.5;
    for (var x = -2; x <= 2; x++) {
      for (var z = 0; z < 2; z++) {
        place({x:cx+x, y:arc+0.3*z|0, z:cz+i}, C.wood);
        if (Math.abs(x)===2) place({x:cx+x, y:arc+1|0, z:cz+i}, C.woodDark);
      }
    }
  }
}

function buildFence() {
  var R = 35;
  for (var a = 0; a < 360; a += 5) {
    var rad = a * Math.PI / 180;
    var x = Math.round(Math.cos(rad)*R);
    var z = Math.round(Math.sin(rad)*R);
    if (x*x+z*z > R*R) continue;
    // Post every 15°
    if (a % 15 === 0) {
      place({x:x, y:1, z:z}, C.fence);
      place({x:x, y:2, z:z}, C.fence);
    }
    // Horizontal rail segments
    if (a % 5 === 0 && a > 0) {
      var pa = (a-5)*Math.PI/180;
      // Interpolate between previous and current angle for rail voxels
      var px = Math.round(Math.cos(pa)*R);
      var pz = Math.round(Math.sin(pa)*R);
      var steps = Math.max(1, Math.sqrt((x-px)*(x-px)+(z-pz)*(z-pz)));
      for (var st = 0; st <= steps; st++) {
        var ft = st / steps;
        var rx = Math.round(px + (x-px)*ft);
        var rz = Math.round(pz + (z-pz)*ft);
        place({x:rx, y:1, z:rz}, C.fence);
        place({x:rx, y:2, z:rz}, C.fence);
      }
    }
  }
}

function buildFlowers() {
  var spots = [{x:-12,z:3},{x:-8,z:12},{x:8,z:8},{x:-15,z:-10},
               {x:20,z:5},{x:-5,z:-18},{x:15,z:15},{x:-20,z:15}];
  for (var i = 0; i < spots.length; i++) {
    var s = spots[i];
    place({x:s.x, y:1, z:s.z}, C.leaves);
    place({x:s.x, y:2, z:s.z}, C.leaves);
    var rr = Math.random();
    var col = C.flower;
    if (rr > 0.5) col = C.flowerYell;
    else if (rr > 0.8) col = C.cherryLt;
    place({x:s.x, y:3, z:s.z}, col);
    // Petal ring
    var dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (var d = 0; d < dirs.length; d++) {
      place({x:s.x+dirs[d][0], y:3, z:s.z+dirs[d][1]}, col);
    }
  }
}

function buildClouds() {
  var clouds = [{x:-20,y:35,z:-15},{x:25,y:40,z:10},{x:0,y:38,z:30},{x:-30,y:42,z:20}];
  for (var i = 0; i < clouds.length; i++) {
    var c = clouds[i];
    for (var j = 0; j < 12; j++) {
      place({
        x: c.x + (Math.random()-0.5)*10,
        y: c.y + Math.random()*2,
        z: c.z + (Math.random()-0.5)*6
      }, C.white);
    }
  }
}

function buildSkyDome() {
  var geo = new THREE.SphereGeometry(200, 16, 16);
  var mat = new THREE.MeshBasicMaterial({ color: 0x87CEEB, side: THREE.BackSide });
  scene.add(new THREE.Mesh(geo, mat));
}

// ─── Init ──────────────────────────────────────────────────────────
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.FogExp2(0xc8e6f5, 0.006);

  camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 500);
  camera.position.set(40, 30, 40);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  clock = new THREE.Clock();

  // Lights
  scene.add(new THREE.AmbientLight(0x8899bb, 0.6));
  var sun = new THREE.DirectionalLight(0xffeedd, 1.2);
  sun.position.set(30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -55;
  sun.shadow.camera.right = 55;
  sun.shadow.camera.top = 55;
  sun.shadow.camera.bottom = -55;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 130;
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0x99aacc, 0.3);
  fill.position.set(-20, 15, -20);
  scene.add(fill);

  // Build scene
  buildGround();
  buildPagoda();
  buildPond();
  buildTrees();
  buildLanterns();
  buildBridge();
  buildFence();
  buildFlowers();
  buildClouds();
  buildSkyDome();

  // Commit all instanced meshes AFTER building
  commit();

  window.addEventListener('resize', function(){
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  animate();
}

// ─── Animation ─────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  var t = clock.getElapsedTime();
  var pagX = -5, pagZ = -5;
  var radius = 42;
  camera.position.x = pagX + Math.cos(t*0.08)*radius;
  camera.position.z = pagZ + Math.sin(t*0.08)*radius;
  camera.position.y = 28 + Math.sin(t*0.05)*5;
  camera.lookAt(pagX, 10, pagZ);
  renderer.render(scene, camera);
}

init();

})();
</script>
</body>
</html>
