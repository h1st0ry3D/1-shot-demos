<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pong</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { border: 2px solid #333; }
</style>
</head>
<body>
<canvas id="c" width="800" height="500"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const PADDLE_W = 12, PADDLE_H = 90, PADDLE_SPEED = 7;
const BALL_SIZE = 12, BALL_SPEED_INIT = 5;
const WIN_SCORE = 11;

let keys = {};

const state = {
  p1: { x: 20, y: 200 },
  p2: { x: 768, y: 200 },
  ball: { x: 400, y: 250, vx: BALL_SPEED_INIT, vy: BALL_SPEED_INIT * 0.6 },
  score: { p1: 0, p2: 0 },
  paused: false,
  gameOver: false,
  winner: null
};

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' && state.gameOver) resetGame();
  if (e.key === 'p') state.paused = !state.paused;
});
document.addEventListener('keyup', e => keys[e.key] = false);

function resetBall() {
  state.ball.x = 400;
  state.ball.y = 250;
  state.ball.vx = (Math.random() > 0.5 ? 1 : -1) * BALL_SPEED_INIT;
  state.ball.vy = (Math.random() * 2 - 1) * BALL_SPEED_INIT * 0.6;
}

function resetGame() {
  state.p1.y = 200;
  state.p2.y = 200;
  state.score = { p1: 0, p2: 0 };
  state.gameOver = false;
  state.winner = null;
  resetBall();
}

function update() {
  if (state.paused || state.gameOver) return;

  if (keys['w'] || keys['W']) state.p1.y = Math.max(0, state.p1.y - PADDLE_SPEED);
  if (keys['s'] || keys['S']) state.p1.y = Math.min(canvas.height - PADDLE_H, state.p1.y + PADDLE_SPEED);
  if (keys['ArrowUp']) state.p2.y = Math.max(0, state.p2.y - PADDLE_SPEED);
  if (keys['ArrowDown']) state.p2.y = Math.min(canvas.height - PADDLE_H, state.p2.y + PADDLE_SPEED);

  const b = state.ball;
  b.x += b.vx;
  b.y += b.vy;

  if (b.y <= 0 || b.y + BALL_SIZE >= canvas.height) b.vy *= -1;

  // Paddle collision
  if (b.x <= state.p1.x + PADDLE_W && b.y + BALL_SIZE >= state.p1.y && b.y <= state.p1.y + PADDLE_H) {
    b.vx = Math.abs(b.vx) * 1.05;
    b.x = state.p1.x + PADDLE_W;
  }
  if (b.x + BALL_SIZE >= state.p2.x && b.y + BALL_SIZE >= state.p2.y && b.y <= state.p2.y + PADDLE_H) {
    b.vx = -Math.abs(b.vx) * 1.05;
    b.x = state.p2.x - BALL_SIZE;
  }

  // Score
  if (b.x < 0) { state.score.p2++; checkWin(); }
  if (b.x > canvas.width) { state.score.p1++; checkWin(); }
}

function checkWin() {
  if (state.score.p1 >= WIN_SCORE || state.score.p2 >= WIN_SCORE) {
    state.gameOver = true;
    state.winner = state.score.p1 >= WIN_SCORE ? 'Player 1' : 'Player 2';
  } else {
    resetBall();
  }
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Center line
  ctx.setLineDash([8, 12]);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // Paddles
  ctx.fillStyle = '#fff';
  ctx.fillRect(state.p1.x, state.p1.y, PADDLE_W, PADDLE_H);
  ctx.fillRect(state.p2.x, state.p2.y, PADDLE_W, PADDLE_H);

  // Ball
  ctx.fillRect(state.ball.x, state.ball.y, BALL_SIZE, BALL_SIZE);

  // Score
  ctx.font = '48px monospace';
  ctx.fillStyle = '#555';
  ctx.textAlign = 'center';
  ctx.fillText(state.score.p1, canvas.width / 4, 60);
  ctx.fillText(state.score.p2, 3 * canvas.width / 4, 60);

  // Controls
  ctx.font = '14px monospace';
  ctx.fillStyle = '#444';
  ctx.textAlign = 'left';
  ctx.fillText('W/S: Player 1', 20, canvas.height - 15);
  ctx.textAlign = 'right';
  ctx.fillText('Up/Down: Player 2', canvas.width - 20, canvas.height - 15);
  ctx.textAlign = 'center';
  ctx.fillText('Space: Restart  |  P: Pause', canvas.width / 2, canvas.height - 15);

  if (state.paused) {
    ctx.font = '36px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
  }

  if (state.gameOver) {
    ctx.font = '48px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText(`${state.winner} Wins!`, canvas.width / 2, canvas.height / 2 - 30);
    ctx.font = '20px monospace';
    ctx.fillStyle = '#888';
    ctx.fillText('Press Space to play again', canvas.width / 2, canvas.height / 2 + 20);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
