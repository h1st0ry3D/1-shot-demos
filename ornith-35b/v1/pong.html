<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pong</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
canvas { border: 2px solid #fff; }
</style>
</head>
<body>
<canvas id="game" width="800" height="500"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const PADDLE_W = 12, PADDLE_H = 80;
const BALL_SIZE = 10;
const PADDLE_SPEED = 7;
const BALL_SPEED = 6;

let ball = { x: canvas.width/2, y: canvas.height/2, dx: BALL_SPEED, dy: BALL_SPEED };
let p1 = { y: canvas.height/2 - PADDLE_H/2, score: 0 };
let p2 = { y: canvas.height/2 - PADDLE_H/2, score: 0 };

const keys = {};
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

function reset() {
  ball.x = canvas.width/2;
  ball.y = canvas.height/2;
  ball.dx = (Math.random() > 0.5 ? 1 : -1) * BALL_SPEED;
  ball.dy = (Math.random() * 2 - 1) * BALL_SPEED;
}

function update() {
  // Player 1 (W/S)
  if (keys['w'] || keys['W']) p1.y -= PADDLE_SPEED;
  if (keys['s'] || keys['S']) p1.y += PADDLE_SPEED;
  p1.y = Math.max(0, Math.min(canvas.height - PADDLE_H, p1.y));

  // Player 2 (Arrow Up/Down)
  if (keys['ArrowUp']) p2.y -= PADDLE_SPEED;
  if (keys['ArrowDown']) p2.y += PADDLE_SPEED;
  p2.y = Math.max(0, Math.min(canvas.height - PADDLE_H, p2.y));

  // Ball movement
  ball.x += ball.dx;
  ball.y += ball.dy;

  // Top/bottom bounce
  if (ball.y <= 0 || ball.y >= canvas.height - BALL_SIZE) ball.dy *= -1;

  // Paddle collision
  // P1
  if (ball.x <= 20 + PADDLE_W && ball.y + BALL_SIZE >= p1.y && ball.y <= p1.y + PADDLE_H) {
    ball.dx = Math.abs(ball.dx);
    let hit = (ball.y + BALL_SIZE/2 - p1.y) / PADDLE_H - 0.5;
    ball.dy = hit * BALL_SPEED * 2;
    ball.x = 20 + PADDLE_W;
  }
  // P2
  if (ball.x + BALL_SIZE >= canvas.width - 20 - PADDLE_W && ball.y + BALL_SIZE >= p2.y && ball.y <= p2.y + PADDLE_H) {
    ball.dx = -Math.abs(ball.dx);
    let hit = (ball.y + BALL_SIZE/2 - p2.y) / PADDLE_H - 0.5;
    ball.dy = hit * BALL_SPEED * 2;
    ball.x = canvas.width - 20 - PADDLE_W - BALL_SIZE;
  }

  // Scoring
  if (ball.x < 0) { p2.score++; reset(); }
  if (ball.x > canvas.width) { p1.score++; reset(); }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Center line
  ctx.setLineDash([8, 8]);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(canvas.width/2, 0);
  ctx.lineTo(canvas.width/2, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // Paddles
  ctx.fillStyle = '#fff';
  ctx.fillRect(20, p1.y, PADDLE_W, PADDLE_H);
  ctx.fillRect(canvas.width - 20 - PADDLE_W, p2.y, PADDLE_W, PADDLE_H);

  // Ball
  ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);

  // Scores
  ctx.font = 'bold 60px monospace';
  ctx.fillStyle = '#fff';
  ctx.fillText(p1.score, canvas.width/4, 70);
  ctx.fillText(p2.score, 3*canvas.width/4, 70);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

reset();
loop();
</script>
</body>
</html>
